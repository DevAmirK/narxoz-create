# Distant Horizons defaults for this pack (shipped via packwiz).
# Quality/CPU tuned for weaker clients; warnings silenced for everyone.

[client]
	qualityPreset = "LOW"
	cpuLoad = "LOW"
	maxHorizontalResolution = "BLOCK"
	enableDistantGeneration = true

[client.advanced.graphics]
	lodChunkRenderDistanceRadius = 128
	disableDhFovEffects = true

[client.advanced.threading]
	numberOfWorldGenerationThreads = 2.0
	numberOfBufferBuilderThreads = 2
	numberOfFileHandlerThreads = 2

[common.logging.warning]
	# Hide chat spam on world join (Chunky/G1/etc.)
	showModCompatibilityWarningsOnStartup = false
	logGarbageCollectorWarning = false
	showLowMemoryWarningOnStartup = false
	showPoolInsufficientMemoryWarning = false
	showHighVanillaRenderDistanceWarning = false
	showReplayWarningOnStartup = false
	showUpdateQueueOverloadedChatWarning = false
	showSlowWorldGenSettingWarnings = false
